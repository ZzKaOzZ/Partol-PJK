services:
  - type: web
    name: partol
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_APPS_SCRIPT_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
